<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A3421">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ApiDiario — Gestione Apiari</title>
<style>
:root{
  --miele:#E39A1E;
  --miele-scuro:#B87614;
  --cera:#FAF3E3;
  --propoli:#4A3421;
  --ink:#2B2016;
  --legno:#C8A05F;
  --verde:#5B7F3B;
  --carta:#FFFDF7;
  --rosso:#C0392B;
  --blu:#2D6CDF;
  --linea:#E8DCC4;
  --r:14px;
  --shadow:0 2px 10px rgba(74,52,33,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--cera);color:var(--ink);font-size:16px;line-height:1.45;
}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--propoli);color:var(--cera);
  padding:14px 16px 12px;display:flex;align-items:center;gap:12px}
header .back{font-size:22px;line-height:1;padding:4px 8px 4px 0;color:var(--miele)}
header h1{font-size:19px;font-weight:700;letter-spacing:.02em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .eyebrow{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--miele);margin-bottom:1px}
header .hbtn{font-size:18px;padding:6px;color:var(--cera);opacity:.9}
header .hbtn.on{opacity:1;background:var(--miele);border-radius:8px}
.comb{height:7px;background:
  repeating-linear-gradient(120deg,var(--miele) 0 8px,transparent 8px 16px),
  repeating-linear-gradient(60deg,var(--miele) 0 8px,transparent 8px 16px);opacity:.85}

/* ---------- layout ---------- */
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
.section-title{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--miele-scuro);margin:20px 2px 8px}
.empty{color:#8a7a63;text-align:center;padding:30px 20px;font-size:15px}
.empty b{display:block;font-size:17px;color:var(--propoli);margin-bottom:6px}

/* ---------- cards ---------- */
.card{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);
  box-shadow:var(--shadow);padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.card .hex{flex:none;width:56px;height:62px;display:flex;align-items:center;justify-content:center;
  background:var(--miele);color:#fff;font-weight:800;font-size:22px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.card .hex.green{background:var(--verde)}
.card .body{flex:1;min-width:0}
.card .name{font-weight:700;font-size:17px;color:var(--propoli);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:13px;color:#8a7a63;margin-top:2px}
.card .meta .warn{color:var(--rosso);font-weight:700}
.card .thumb{flex:none;width:66px;height:66px;border-radius:12px;object-fit:cover;border:1px solid var(--linea)}
.iconbtn{flex:none;font-size:17px;padding:8px;color:#9a8768;border-radius:8px}
.iconbtn:active{background:var(--cera)}
.dotrow{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%}
.minichip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;color:#fff;line-height:1.5;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- fab ---------- */
.fab{position:fixed;right:18px;bottom:22px;z-index:15;background:var(--miele);color:#fff;
  font-weight:700;font-size:15px;padding:15px 20px;border-radius:999px;
  box-shadow:0 5px 16px rgba(184,118,20,.45);display:flex;align-items:center;gap:8px}
.fab:active{transform:scale(.97)}

/* ---------- tabs ---------- */
.tabs{display:flex;background:var(--carta);border:1px solid var(--linea);border-radius:999px;
  padding:4px;margin-bottom:16px;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:10px 4px;border-radius:999px;font-weight:700;font-size:13.5px;color:#8a7a63}
.tabs button.on{background:var(--propoli);color:var(--cera)}

/* ---------- chips / etichette ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
  font-size:14px;font-weight:600;color:#fff;border:2px solid transparent}
.chip.off{opacity:.35;filter:grayscale(.6)}
.chip.add{background:transparent;color:var(--miele-scuro);border:2px dashed var(--legno)}
.pickrow{display:flex;align-items:center;gap:8px;padding:6px 0}

/* ---------- arnia ---------- */
.photo-wrap{position:relative;border-radius:var(--r);overflow:hidden;background:var(--carta);
  border:1px solid var(--linea);box-shadow:var(--shadow);margin-bottom:14px;min-height:150px;
  display:flex;align-items:center;justify-content:center}
.photo-wrap img{width:100%;max-height:320px;object-fit:cover;display:block}
.photo-wrap .noimg{color:#b3a184;font-size:15px;text-align:center;padding:36px 20px}
.photo-wrap .noimg .bee{font-size:38px;display:block;margin-bottom:6px}
.photo-btn{position:absolute;right:10px;bottom:10px;background:rgba(74,52,33,.88);color:var(--cera);
  padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600}
.regina{display:flex;align-items:center;gap:12px;background:var(--carta);border:1px solid var(--linea);
  border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px}
.regina .crown{font-size:24px}
.regina .lbl{flex:1;font-weight:600;color:var(--propoli)}
.regina .badge{font-weight:800;font-size:16px;padding:6px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.12)}
.panel{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);
  box-shadow:var(--shadow);padding:14px;margin-bottom:14px}

/* ---------- registro (details) ---------- */
details.reg{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:12px;padding:0 14px}
details.reg summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:700;
  color:var(--propoli);display:flex;align-items:center;gap:9px;font-size:15.5px}
details.reg summary::-webkit-details-marker{display:none}
details.reg summary .cnt{margin-left:auto;font-size:12.5px;color:#9a8768;font-weight:600}
details.reg .inner{border-top:1px solid var(--linea);padding:8px 0 14px}
.ritem{border-top:1px solid var(--linea);padding:11px 2px}
.ritem:first-child{border-top:0}
.rtop{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--propoli)}
.rtop .sp{flex:1}
.rmeta{font-size:13px;color:#8a7a63;margin-top:2px;white-space:pre-wrap}
.cad{display:inline-block;background:var(--cera);border:1px solid var(--linea);border-radius:999px;
  padding:3px 10px;font-size:12.5px;margin:6px 6px 0 0;color:#6d5c44}
.addmini{color:var(--miele-scuro);font-weight:700;font-size:13px;padding:6px 0 2px;display:inline-block}
.statline{font-size:13.5px;color:#6d5c44;margin:4px 0 6px;font-weight:600}
.bulkrow{display:flex;gap:8px;margin-bottom:14px}
.bulkrow button{flex:1;background:var(--carta);border:1px solid var(--linea);border-radius:10px;
  padding:10px 6px;font-weight:600;font-size:13px;color:var(--propoli);box-shadow:var(--shadow)}

/* ---------- commenti / composer ---------- */
.composer{display:flex;flex-direction:column;gap:10px}
.composer textarea{width:100%;min-height:76px;border:1px solid var(--linea);border-radius:10px;
  padding:10px 12px;background:#fff;resize:vertical}
.composer textarea:focus{outline:2px solid var(--miele)}
.composer .row{display:flex;gap:10px}
.fnum{display:flex;gap:8px}
.fnum label{flex:1;font-size:12px;color:#8a7a63;font-weight:700}
.fnum input{width:100%;border:1px solid var(--linea);border-radius:10px;padding:8px;background:#fff;margin-top:3px}
.micbtn{flex:none;width:52px;height:44px;border-radius:10px;background:var(--cera);
  border:1px solid var(--legno);font-size:20px;display:flex;align-items:center;justify-content:center}
.micbtn.rec{background:var(--rosso);border-color:var(--rosso);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}50%{box-shadow:0 0 0 9px rgba(192,57,43,0)}}
@media (prefers-reduced-motion:reduce){.micbtn.rec{animation:none}}
.savebtn{flex:1;background:var(--verde);color:#fff;font-weight:700;border-radius:10px;padding:11px}
.comment{border-top:1px solid var(--linea);padding:12px 2px}
.comment:first-of-type{border-top:0}
.comment .cdate{font-size:12px;color:#9a8768;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.comment .cdate .sp{flex:1}
.comment p{margin-top:5px;white-space:pre-wrap}
.comment.done p{text-decoration:line-through;color:#9a8768}
.forza{margin-top:6px;font-size:13px;color:var(--miele-scuro);font-weight:700}
.checkbtn{width:26px;height:26px;border-radius:8px;border:2px solid var(--legno);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.checkbtn.on{background:var(--verde);border-color:var(--verde)}
.due{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.due.red{background:#fdeceb;color:var(--rosso)}
.due.amb{background:#fdf3dd;color:#9a6b00}
.due.grey{background:var(--cera);color:#8a7a63}
.exportbtn{width:100%;background:var(--propoli);color:var(--cera);font-weight:700;
  border-radius:10px;padding:13px;margin-top:4px}

/* ---------- grafico ---------- */
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;margin-top:8px;color:#6d5c44;justify-content:center;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(43,32,22,.55);z-index:40;
  display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--carta);width:100%;max-width:560px;border-radius:18px 18px 0 0;
  padding:18px 18px 26px;max-height:88vh;overflow:auto}
.modal h2{font-size:17px;color:var(--propoli);margin-bottom:12px}
.modal input[type=text],.modal input[type=number],.modal input[type=date],.modal textarea,.modal select{
  width:100%;border:1px solid var(--linea);border-radius:10px;padding:11px 12px;background:#fff;margin-bottom:12px}
.modal textarea{min-height:100px;resize:vertical}
.modal input:focus,.modal textarea:focus,.modal select:focus{outline:2px solid var(--miele)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.mrow{display:flex;gap:10px}
.mrow.col{flex-direction:column}
.mbtn{flex:1;padding:12px;border-radius:10px;font-weight:700}
.mbtn.pri{background:var(--miele);color:#fff}
.mbtn.sec{background:var(--cera);border:1px solid var(--linea);color:var(--propoli)}
.mbtn.del{background:#fdf0ee;border:1px solid #eac4bd;color:var(--rosso)}
.hint{font-size:12.5px;color:#9a8768;margin-bottom:6px}
.flabel{font-size:12.5px;color:#6d5c44;font-weight:700;margin-bottom:4px}
</style>
</head>
<body>

<header>
  <button class="back hidden" id="btnBack" aria-label="Indietro">‹</button>
  <h1 id="hTitle"><span class="eyebrow" id="hEyebrow">ApiDiario</span><span id="hName">I miei apiari</span></h1>
  <button class="hbtn" id="btnWake" title="Schermo sempre acceso" aria-label="Schermo sempre acceso">💡</button>
  <button class="hbtn" id="btnBackup" title="Backup dati" aria-label="Backup dati">⛃</button>
</header>
<div class="comb"></div>

<main id="main"></main>

<button class="fab hidden" id="fab"></button>

<div class="overlay hidden" id="overlay"></div>

<input type="file" accept="image/*" capture="environment" id="fileCam" class="hidden">
<input type="file" accept="image/*" id="fileFoto" class="hidden">
<input type="file" accept="application/json" id="fileImport" class="hidden">

<script>
"use strict";
/* ================= STORAGE (IndexedDB) ================= */
let db=null, state=null;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open("apidiario",1);
  r.onupgradeneeded=e=>{e.target.result.createObjectStore("kv");};
  r.onsuccess=e=>{db=e.target.result;res();};
  r.onerror=()=>rej(r.error);
});}
function dbGet(k){return new Promise((res,rej)=>{
  const q=db.transaction("kv").objectStore("kv").get(k);
  q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
});}
function dbSet(k,v){return new Promise((res,rej)=>{
  const q=db.transaction("kv","readwrite").objectStore("kv").put(v,k);
  q.onsuccess=()=>res();q.onerror=()=>rej(q.error);
});}
async function save(){await dbSet("state",state);}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const oggi=()=>new Date().toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const fmtDate=iso=>{if(!iso)return"";const[y,m,g]=iso.split("-");return `${g}/${m}/${y}`;};
const nv=v=>{const n=parseFloat(String(v??"").replace(",","."));return isNaN(n)?null:n;};
const kg1=v=>Math.round(v*10)/10;

/* ================= NAVIGAZIONE ================= */
const nav={view:"home",apId:null,arId:null,tab:"arnie",atab:"isp",regOpen:new Set(["trat"])};
const $=s=>document.querySelector(s);
const main=$("#main"), fab=$("#fab"), overlay=$("#overlay");
let objURLs=[];
function freeURLs(){objURLs.forEach(u=>URL.revokeObjectURL(u));objURLs=[];}
function blobURL(b){const u=URL.createObjectURL(b);objURLs.push(u);return u;}
const getAp=()=>state.apiari.find(a=>a.id===nav.apId);
const getAr=()=>{const a=getAp();return a?a.arnie.find(x=>x.id===nav.arId):null;};

function go(view,apId,arId,tab){
  stopRec();
  nav.view=view; if(apId!==undefined)nav.apId=apId; if(arId!==undefined)nav.arId=arId;
  if(tab)nav.tab=tab;
  if(view==="arnia")nav.atab="isp";
  render();
  window.scrollTo(0,0);
}
$("#btnBack").addEventListener("click",()=>{
  if(nav.view==="arnia")go("apiario",nav.apId,null,"arnie");
  else go("home",null,null);
});

/* ================= ETICHETTE (catalogo globale) ================= */
const COLORI=["#E39A1E","#C0392B","#5B7F3B","#2D6CDF","#8E44AD","#7B5233","#D96A2B","#57707A"];
const cat=id=>state.etichette.find(e=>e.id===id);
function removeEtichettaOvunque(id){
  state.etichette=state.etichette.filter(e=>e.id!==id);
  state.apiari.forEach(a=>{
    a.bacheca.etichette=a.bacheca.etichette.filter(x=>x.id!==id);
    a.arnie.forEach(ar=>{ar.etichette=ar.etichette.filter(x=>x!==id);});
  });
}
function coloreRegina(anno){
  const d=Math.abs(anno)%10;
  if(d===1||d===6)return{bg:"#F4F2EA",fg:"#4a4a44",n:"Bianco"};
  if(d===2||d===7)return{bg:"#F2C200",fg:"#4a3a00",n:"Giallo"};
  if(d===3||d===8)return{bg:"#CC3A2C",fg:"#fff",n:"Rosso"};
  if(d===4||d===9)return{bg:"#2C8A3D",fg:"#fff",n:"Verde"};
  return{bg:"#2D6CDF",fg:"#fff",n:"Blu"};
}
const mieleArnia=ar=>kg1(ar.produzione.reduce((s,p)=>s+(p.kg||0),0)+ar.melari.reduce((s,m)=>s+(m.kg||0),0));

/* ================= RENDER ================= */
function render(){
  freeURLs();
  $("#btnBack").classList.toggle("hidden",nav.view==="home");
  if(nav.view==="home")renderHome();
  else if(nav.view==="apiario")renderApiario();
  else renderArnia();
}
function setHeader(eyebrow,name){$("#hEyebrow").textContent=eyebrow;$("#hName").textContent=name;}

/* ---------- HOME ---------- */
function renderHome(){
  setHeader("ApiDiario","I miei apiari");
  fab.classList.remove("hidden");
  fab.innerHTML="＋ Nuovo apiario";
  fab.onclick=()=>editTextModal({title:"Nome del nuovo apiario",value:"",placeholder:"Es. Apiario Casa",onSave:v=>{
    if(!v.trim())return;
    state.apiari.push({id:uid(),nome:v.trim(),arnie:[],bacheca:{etichette:[],note:[]}});
    save();render();
  }});
  if(!state.apiari.length){
    main.innerHTML=`<div class="empty"><b>Nessun apiario ancora</b>Tocca «＋ Nuovo apiario» per creare il primo.<br>La sua Bacheca verrà creata automaticamente.</div>`;
    return;
  }
  const t=todayISO();
  main.innerHTML=state.apiari.map(a=>{
    const daFare=a.bacheca.note.filter(n=>!n.fatto).length;
    const scadute=a.bacheca.note.filter(n=>!n.fatto&&n.scadenza&&n.scadenza<t).length;
    return `<div class="card" data-id="${a.id}">
      <div class="hex" data-open>🐝</div>
      <div class="body" data-open>
        <div class="name">${esc(a.nome)}</div>
        <div class="meta">${a.arnie.length} arni${a.arnie.length===1?"a":"e"} · Bacheca-${esc(a.nome)}${daFare?` · ${daFare} da fare`:""}${scadute?` · <span class="warn">⚠ ${scadute} scadut${scadute===1?"a":"e"}</span>`:""}</div>
      </div>
      <button class="iconbtn" data-bacheca title="Bacheca">📌</button>
      <button class="iconbtn" data-ren title="Rinomina">✏️</button>
      <button class="iconbtn" data-del title="Elimina">🗑</button>
    </div>`;}).join("");
  main.querySelectorAll(".card").forEach(c=>{
    const id=c.dataset.id, ap=state.apiari.find(a=>a.id===id);
    c.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",()=>go("apiario",id,null,"arnie")));
    c.querySelector("[data-bacheca]").addEventListener("click",()=>go("apiario",id,null,"bacheca"));
    c.querySelector("[data-ren]").addEventListener("click",()=>editTextModal({title:"Rinomina apiario",value:ap.nome,onSave:v=>{if(v.trim()){ap.nome=v.trim();save();render();}}}));
    c.querySelector("[data-del]").addEventListener("click",()=>{
      if(confirm(`Eliminare «${ap.nome}» con tutte le sue arnie e la sua bacheca?`)){
        state.apiari=state.apiari.filter(a=>a.id!==id);save();render();
      }});
  });
}

/* ---------- APIARIO (arnie + bacheca) ---------- */
function renderApiario(){
  const ap=getAp(); if(!ap){go("home");return;}
  setHeader("Apiario",ap.nome);
  let html=`<div class="tabs">
    <button id="tabArnie" class="${nav.tab==="arnie"?"on":""}">Arnie</button>
    <button id="tabBacheca" class="${nav.tab==="bacheca"?"on":""}">📌 Bacheca</button>
  </div>`;
  if(nav.tab==="arnie")html+=htmlArnie(ap); else html+=htmlBacheca(ap);
  main.innerHTML=html;
  $("#tabArnie").addEventListener("click",()=>{nav.tab="arnie";render();});
  $("#tabBacheca").addEventListener("click",()=>{nav.tab="bacheca";render();});
  if(nav.tab==="arnie")bindArnie(ap); else bindBacheca(ap);
}

function htmlArnie(ap){
  fab.classList.remove("hidden");
  fab.innerHTML="＋ Nuova arnia";
  if(!ap.arnie.length)return `<div class="empty"><b>Nessuna arnia</b>Aggiungi la prima arnia di «${esc(ap.nome)}».</div>`;
  const bulk=`<div class="bulkrow">
    <button id="bulkTrat">🧪 Trattamento a tutte</button>
    <button id="bulkNutr">🥣 Nutrizione a tutte</button>
  </div>`;
  return bulk+ap.arnie.map(ar=>{
    const foto=ar.foto?`<img class="thumb" src="${blobURL(ar.foto)}" alt="">`:`<div class="hex green">🏠</div>`;
    const dots=ar.etichette.map(id=>cat(id)).filter(Boolean).map(e=>`<span class="minichip" style="background:${e.colore}">${esc(e.testo)}</span>`).join("");
    const rc=ar.annoRegina?coloreRegina(ar.annoRegina):null;
    const kg=mieleArnia(ar);
    return `<div class="card" data-id="${ar.id}">
      ${foto}
      <div class="body" data-open>
        <div class="name">${esc(ar.nome)}</div>
        <div class="meta">${rc?`Regina ${ar.annoRegina} (${rc.n})`:"Regina non indicata"} · ${ar.commenti.length} ispezioni${kg?` · 🍯 ${kg} kg`:""}</div>
        <div class="dotrow">${dots}</div>

/* ---------- BACHECA ---------- */
function noteOrdinate(b){
  return b.note.slice().sort((a,z)=>{
    if(!!a.fatto!==!!z.fatto)return a.fatto?1:-1;
    const as=a.scadenza||"9999-99-99", zs=z.scadenza||"9999-99-99";
    if(as!==zs)return as<zs?-1:1;
    return 0;
  });
}
function dueBadge(n){
  if(!n.scadenza)return"";
  if(n.fatto)return `<span class="due grey">📅 ${fmtDate(n.scadenza)}</span>`;
  const t=todayISO();
  if(n.scadenza<t)return `<span class="due red">⚠ scaduta il ${fmtDate(n.scadenza)}</span>`;
  const diff=(new Date(n.scadenza+"T00:00")-new Date(t+"T00:00"))/864e5;
  return `<span class="due ${diff<=7?"amb":"grey"}">📅 entro il ${fmtDate(n.scadenza)}</span>`;
}
function htmlBacheca(ap){
  fab.classList.add("hidden");
  const b=ap.bacheca;
  const chips=b.etichette.map(x=>{const e=cat(x.id);return e?`
    <button class="chip ${x.attiva?"":"off"}" data-eid="${e.id}" style="background:${e.colore}">${esc(e.testo)}</button>`:"";}).join("")
    +`<button class="chip add" id="addEt">＋ etichetta</button>`;
  const note=b.note.length?noteOrdinate(b).map(n=>`
    <div class="comment ${n.fatto?"done":""}" data-nid="${n.id}">
      <div class="cdate">
        <button class="checkbtn ${n.fatto?"on":""}" data-check title="Fatto">${n.fatto?"✓":""}</button>
        ${esc(n.data)} ${dueBadge(n)}<span class="sp"></span>
        <button class="iconbtn" data-edit title="Modifica">✏️</button>
        <button class="iconbtn" data-del title="Elimina">🗑</button>
      </div>
      <p>${esc(n.testo)}</p>
    </div>`).join(""):`<div class="empty">Nessuna azione in programma.<br>Detta o scrivi cosa fare alla prossima visita.</div>`;
  return `
    <div class="section-title">Bacheca-${esc(ap.nome)} · etichette</div>
    <div class="panel"><div class="chips">${chips}</div>
      <div class="hint" style="margin:10px 0 0">Tocca un'etichetta per attivarla o disattivarla, tienila premuta per gestirla. Con «＋ etichetta» scegli dall'elenco o ne crei di nuove.</div>
    </div>
    <div class="section-title">Cose da fare alla prossima visita</div>
    <div class="panel">
      <div class="composer">
        <textarea id="txtNota" placeholder="Es. Aggiungere melario all'arnia 3, controllare covata…"></textarea>
        <div class="flabel">Scadenza (facoltativa)</div>
        <input type="date" id="dtNota" style="border:1px solid var(--linea);border-radius:10px;padding:9px 12px;background:#fff">
        <div class="row">
          <button class="micbtn" id="micNota" title="Detta a voce">🎙️</button>
          <button class="savebtn" id="saveNota">Aggiungi alla bacheca</button>
        </div>
      </div>
    </div>
    <div class="panel">${note}</div>`;
}
function bindBacheca(ap){
  const b=ap.bacheca;
  $("#addEt").addEventListener("click",()=>pickerEtichette({
    title:"Etichette della bacheca",
    isAssigned:id=>b.etichette.some(x=>x.id===id),
    toggle:(id,forceOn)=>{
      const i=b.etichette.findIndex(x=>x.id===id);
      if(i>-1&&!forceOn)b.etichette.splice(i,1);
      else if(i===-1)b.etichette.push({id,attiva:true});
    }
  }));
  main.querySelectorAll(".chip[data-eid]").forEach(ch=>{
    const x=b.etichette.find(e=>e.id===ch.dataset.eid);
    const entry=cat(x.id);
    const azioni=()=>chipActionModal(entry,"a bacheca",()=>{
      b.etichette=b.etichette.filter(e=>e.id!==x.id);
    });
    let t=null;
    ch.addEventListener("touchstart",()=>{t=setTimeout(()=>{t=null;azioni();},550);},{passive:true});
    ch.addEventListener("touchend",()=>{if(t){clearTimeout(t);x.attiva=!x.attiva;save();render();}});
    ch.addEventListener("contextmenu",e=>e.preventDefault());
    ch.addEventListener("click",()=>{ if(!("ontouchstart" in window)){ x.attiva=!x.attiva;save();render(); }});
    ch.addEventListener("dblclick",azioni);
  });
  const ta=$("#txtNota");
  $("#micNota").addEventListener("click",e=>toggleRec(e.currentTarget,ta));
  $("#saveNota").addEventListener("click",()=>{
    if(!ta.value.trim())return;
    const sc=$("#dtNota").value||null;
    b.note.unshift({id:uid(),data:oggi(),testo:ta.value.trim(),fatto:false,scadenza:sc});
    ta.value="";stopRec();save();render();
  });
  main.querySelectorAll(".comment").forEach(c=>{
    const n=b.note.find(x=>x.id===c.dataset.nid);
    c.querySelector("[data-check]").addEventListener("click",()=>{n.fatto=!n.fatto;save();render();});
    c.querySelector("[data-edit]").addEventListener("click",()=>formModal({
      title:"Modifica nota",
      fields:[
        {key:"testo",label:"Nota",type:"textarea",value:n.testo,mic:true},
        {key:"scadenza",label:"Scadenza (facoltativa)",type:"date",value:n.scadenza||""}
      ],
      onSave:v=>{if(v.testo.trim())n.testo=v.testo.trim();n.scadenza=v.scadenza||null;save();render();}
    }));
    c.querySelector("[data-del]").addEventListener("click",()=>{if(confirm("Eliminare questa nota?")){b.note=b.note.filter(x=>x.id!==n.id);save();render();}});
  });
}

    ch.addEventListener("click",()=>chipActionModal(entry,"a arnia",()=>{
      ar.etichette=ar.etichette.filter(x=>x!==entry.id);
    }));
  });
  $("#atIsp").addEventListener("click",()=>{nav.atab="isp";render();});
  $("#atReg").addEventListener("click",()=>{nav.atab="reg";render();});

/* ----- tab andamento ----- */
function htmlAndamento(ar){
  const pts=ar.commenti.slice().reverse()
    .filter(c=>c.covata!=null||c.api!=null||c.scorte!=null)
    .map(c=>({d:String(c.data).split(",")[0],covata:c.covata,api:c.api,scorte:c.scorte}));
  const kgMel=kg1(ar.melari.reduce((s,m)=>s+(m.kg||0),0));
  const kgProd=kg1(ar.produzione.reduce((s,p)=>s+(p.kg||0),0));
  let chart;
  if(pts.length<2){
    chart=`<div class="empty"><b>Ancora pochi dati</b>Compila i telaini (covata, api, scorte) in almeno due ispezioni per vedere l'andamento della famiglia nel tempo.</div>`;
  }else{
    const W=340,H=200,P=30;
    const max=Math.max(1,...pts.flatMap(p=>[p.covata||0,p.api||0,p.scorte||0]));
    const X=i=>P+i*(W-2*P)/(pts.length-1);
    const Y=v=>H-P-(v/max)*(H-2*P);
    const serie=(k,col)=>{
      const seg=pts.map((p,i)=>p[k]!=null?`${X(i).toFixed(1)},${Y(p[k]).toFixed(1)}`:null).filter(Boolean);
      if(!seg.length)return"";
      const dots=pts.map((p,i)=>p[k]!=null?`<circle cx="${X(i).toFixed(1)}" cy="${Y(p[k]).toFixed(1)}" r="3.5" fill="${col}"/>`:"").join("");
      return (seg.length>1?`<polyline points="${seg.join(" ")}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`:"")+dots;
    };
    let grid="";
    [0,.5,1].forEach(t=>{
      const v=max*t, y=Y(v);
      grid+=`<line x1="${P}" y1="${y}" x2="${W-P}" y2="${y}" stroke="#E8DCC4" stroke-width="1"/>
             <text x="${P-5}" y="${y+4}" font-size="10" fill="#9a8768" text-anchor="end">${Math.round(v)}</text>`;
    });
    const lbl=`<text x="${P}" y="${H-8}" font-size="10" fill="#9a8768">${esc(pts[0].d)}</text>
               <text x="${W-P}" y="${H-8}" font-size="10" fill="#9a8768" text-anchor="end">${esc(pts[pts.length-1].d)}</text>`;
    chart=`<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento telaini">
      ${grid}${lbl}
      ${serie("covata","#C0392B")}${serie("api","#E39A1E")}${serie("scorte","#2D6CDF")}
    </svg>
    <div class="legend">
      <span><i style="background:#C0392B"></i>Covata</span>
      <span><i style="background:#E39A1E"></i>Api</span>
      <span><i style="background:#2D6CDF"></i>Scorte</span>
    </div></div>`;
  }
  return `
    <div class="section-title">Forza della famiglia (telaini)</div>
    <div class="panel">${chart}</div>
    <div class="section-title">Riepilogo</div>
    <div class="panel">
      <div class="statline">🍯 Miele prodotto: ${kg1(kgProd+kgMel)} kg${kgProd&&kgMel?` (${kgProd} kg registrati + ${kgMel} kg dai melari)`:""}</div>
      <div class="statline">📝 ${ar.commenti.length} ispezioni registrate</div>
      <div class="statline">🧪 ${ar.trattamenti.length} trattamenti · ${ar.trattamenti.reduce((s,t)=>s+t.cadute.length,0)} conteggi caduta</div>
      <div class="statline">🥣 ${ar.nutrizione.length} nutrizioni</div>
      <div class="statline">⚖️ ${ar.melari.length} melari registrati</div>
      <div class="statline">🐝 ${ar.sciamature.length} eventi di sciamatura/sciami</div>
    </div>`;
}

let pendingFoto=null; /* {apId,arId} se scattata dalla lista arnie, altrimenti arnia corrente */
async function gestisciFoto(e){
  const f=e.target.files[0]; e.target.value="";
  if(!f)return;
  let ar=null;
  if(pendingFoto){
    const ap=state.apiari.find(a=>a.id===pendingFoto.apId);
    ar=ap?ap.arnie.find(x=>x.id===pendingFoto.arId):null;
    pendingFoto=null;
  }else ar=getAr();
  if(!ar)return;
  try{
    ar.foto=await comprimi(f);
    await save();render();
  }catch(err){alert("Impossibile caricare la foto: "+err.message);}
}
$("#fileCam").addEventListener("change",gestisciFoto);
$("#fileFoto").addEventListener("change",gestisciFoto);
async function comprimi(file){
  const img=await createImageBitmap(file);
  const max=1200, s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("compressione fallita")),"image/jpeg",.82));
}

  const kgMel=kg1(ar.melari.reduce((s,m)=>s+(m.kg||0),0));
  const kgProd=kg1(ar.produzione.reduce((s,p)=>s+(p.kg||0),0));
  const etich=ar.etichette.map(id=>cat(id)).filter(Boolean).map(e=>e.testo);
  let txt=`APIDIARIO — Registro arnia\n==========================\nApiario: ${ap.nome}\nArnia:   ${ar.nome}\nRegina:  ${ar.annoRegina?ar.annoRegina+" ("+rc.n+")":"non indicata"}\nEtichette: ${etich.join(", ")||"—"}\nMiele prodotto: ${kg1(kgProd+kgMel)} kg\nEsportato il: ${oggi()}\n`;
  txt+=`\n=== ISPEZIONI (${ar.commenti.length}) ===\n`;
  if(!ar.commenti.length)txt+="Nessuna.\n";
  ar.commenti.slice().reverse().forEach(c=>{
    txt+=`\n--- ${c.data} ---\n${c.testo}\n`;
    const f=[c.covata!=null?`covata ${c.covata}`:null,c.api!=null?`api ${c.api}`:null,c.scorte!=null?`scorte ${c.scorte}`:null].filter(Boolean);
    if(f.length)txt+=`Telaini: ${f.join(" · ")}\n`;
  });
  txt+=`\n=== TRATTAMENTI VARROA (${ar.trattamenti.length}) ===\n`;
  if(!ar.trattamenti.length)txt+="Nessuno.\n";
  ar.trattamenti.slice().reverse().forEach(t=>{
    txt+=`\n${fmtDate(t.data)} — ${t.prodotto}${t.note?" — "+t.note:""}\n`;
    t.cadute.forEach(c=>{txt+=`   caduta ${fmtDate(c.data)}: ${c.n} acari\n`;});
  });
  txt+=`\n=== NUTRIZIONE (${ar.nutrizione.length}) ===\n`;
  if(!ar.nutrizione.length)txt+="Nessuna.\n";
  ar.nutrizione.slice().reverse().forEach(n=>{
    txt+=`${fmtDate(n.data)} — ${n.tipo}${n.quantita?" "+n.quantita:""}${n.note?" — "+n.note:""}\n`;
  });
  txt+=`\n=== PRODUZIONE MIELE (${ar.produzione.length}) — ${kgProd} kg ===\n`;
  if(!ar.produzione.length)txt+="Nessuna.\n";
  ar.produzione.slice().reverse().forEach(p=>{
    txt+=`${fmtDate(p.data)} — ${p.kg} kg${p.tipo?" "+p.tipo:""}${p.note?" — "+p.note:""}\n`;
  });
  txt+=`\n=== MELARI (${ar.melari.length}) — resa ${kgMel} kg ===\n`;
  if(!ar.melari.length)txt+="Nessuno.\n";
  ar.melari.slice().reverse().forEach(m=>{
    txt+=`Posato ${fmtDate(m.dataPosa)}${m.dataTolto?` — tolto ${fmtDate(m.dataTolto)} — resa ${m.kg??0} kg`:" — ancora in posa"}${m.note?" — "+m.note:""}\n`;
  });
  txt+=`\n=== SCIAMATURE E SCIAMI (${ar.sciamature.length}) ===\n`;
  if(!ar.sciamature.length)txt+="Nessuno.\n";
  ar.sciamature.slice().reverse().forEach(s=>{
    txt+=`${fmtDate(s.data)} — ${s.evento}${s.note?" — "+s.note:""}\n`;
  });
  const nome=`${ap.nome}_${ar.nome}`.replace(/[^\wàèéìòù-]+/gi,"_")+".txt";
  const blob=new Blob([txt],{type:"text/plain"});
  const file=new File([blob],nome,{type:"text/plain"});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:nome});return;}catch(e){if(e.name==="AbortError")return;}
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=nome;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---------- DETTATURA VOCALE ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
/* Registra una frase alla volta (continuous=false) e riparte da sola finché il
   microfono è attivo. Così si evita il difetto di Android Chrome che, in modalità
   continua, rimanda ogni volta tutta la frase accumulata creando ripetizioni. */
let rec=null,recBtn=null,recTarget=null,recAttivo=false;
function toggleRec(btn,target){
  if(recAttivo){stopRec();return;}
  if(!SR){alert("La dettatura vocale non è disponibile in questo browser. Su Android usa Chrome. Puoi anche usare il microfono della tastiera Gboard.");return;}
  recAttivo=true;recBtn=btn;recTarget=target;
  btn.classList.add("rec");
  avviaSessione();
}
function avviaSessione(){
  if(!recAttivo||!recTarget||!document.body.contains(recTarget)){fineRec();return;}
  const target=recTarget;
  const base=target.value.trim()?target.value.replace(/\s+$/,"")+" ":"";
  const r=new SR();rec=r;
  r.lang="it-IT";r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
  r.onresult=e=>{
    if(!document.body.contains(target))return;
    /* l'ultimo risultato contiene già la frase completa di questa sessione */
    const t=e.results[e.results.length-1][0].transcript.trim();
    target.value=base+t;
  };
  r.onerror=ev=>{
    if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){
      recAttivo=false;
      alert("Permesso microfono negato. Consenti il microfono nelle impostazioni dell'app.");
    }
    /* "no-speech" e "aborted" sono normali pause: la sessione riparte da onend */
  };
  r.onend=()=>{
    if(rec===r)rec=null;
    if(recAttivo)setTimeout(avviaSessione,120); else fineRec();
  };
  try{r.start();}catch(e){fineRec();}
}
function fineRec(){
  recAttivo=false;
  if(recBtn)recBtn.classList.remove("rec");
  recBtn=null;recTarget=null;rec=null;
}
function stopRec(){
  /* stop() lascia arrivare l'ultimo pezzo di frase, poi onend chiude tutto */
  recAttivo=false;
  if(recBtn)recBtn.classList.remove("rec");
  if(rec){try{rec.stop();}catch(e){fineRec();}} else fineRec();
}

/* Modale generico a campi: text | number | date | select | textarea (mic opzionale) */
function formModal({title,fields,saveLabel="Salva",onSave}){
  const inner=fields.map(f=>{
    const id="f_"+f.key;
    if(f.type==="select")
      return `<div class="flabel">${esc(f.label)}</div><select id="${id}">${f.options.map(o=>`<option ${o===f.value?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    if(f.type==="textarea")
      return `<div class="flabel">${esc(f.label)}</div><textarea id="${id}">${esc(f.value??"")}</textarea>`
        +(f.mic?`<div class="mrow" style="margin-bottom:12px"><button class="micbtn" data-mic="${id}" style="width:100%">🎙️ Detta a voce</button></div>`:"");
    return `<div class="flabel">${esc(f.label)}</div><input id="${id}" type="${f.type||"text"}" value="${esc(f.value??"")}" ${f.type==="number"?'inputmode="decimal" step="any"':""}>`;
  }).join("");
  openModal(`
    <h2>${esc(title)}</h2>${inner}
    <div class="mrow">
      <button class="mbtn sec" id="mCancel">Annulla</button>
      <button class="mbtn pri" id="mOk">${esc(saveLabel)}</button>
    </div>`);
  overlay.querySelectorAll("[data-mic]").forEach(b=>b.addEventListener("click",e=>toggleRec(e.currentTarget,$("#"+b.dataset.mic))));

  $("#mOk").addEventListener("click",()=>{
    const v={};fields.forEach(f=>{v[f.key]=$("#f_"+f.key).value;});

  });

/* Crea o modifica un'etichetta del catalogo globale */
function labelModal(entry,{onSaved}={}){
  const isNew=!entry;
  let colore=entry?entry.colore:COLORI[0];
  openModal(`
    <h2>${isNew?"Nuova etichetta":"Modifica etichetta"}</h2>
    ${isNew?"":`<div class="hint" style="margin-bottom:10px">Le modifiche valgono ovunque questa etichetta è usata (arnie e bacheche).</div>`}
    <input id="mVal" type="text" value="${entry?esc(entry.testo):""}" placeholder="Es. Da nutrire, Sciamatura, Regina nuova…">
    <div class="hint">Colore</div>
    <div class="swatches">${COLORI.map(c=>`<button class="sw ${c===colore?"on":""}" data-c="${c}" style="background:${c}"></button>`).join("")}</div>
    <div class="mrow">
      ${isNew?"":`<button class="mbtn del" id="mDel">Elimina</button>`}
      <button class="mbtn sec" id="mCancel">Annulla</button>
      <button class="mbtn pri" id="mOk">Salva</button>
    </div>`);
  overlay.querySelectorAll(".sw").forEach(s=>s.addEventListener("click",()=>{
    colore=s.dataset.c;
    overlay.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===s));
  }));
  $("#mCancel").addEventListener("click",()=>{closeModal();if(onSaved)onSaved(null);});
  if(!isNew)$("#mDel").addEventListener("click",()=>{
    if(!confirm(`Eliminare «${entry.testo}» dall'elenco e da tutte le arnie e bacheche che la usano?`))return;
    removeEtichettaOvunque(entry.id);
    closeModal();save();
    if(onSaved)onSaved(null); else render();
  });
  $("#mOk").addEventListener("click",()=>{
    const v=$("#mVal").value.trim();
    if(!v){closeModal();if(onSaved)onSaved(null);return;}
    let id;
    if(isNew){id=uid();state.etichette.push({id,testo:v,colore});}
    else{entry.testo=v;entry.colore=colore;id=entry.id;}
    closeModal();save();
    if(onSaved)onSaved(id); else render();
  });
}

        <button class="mbtn sec" id="mClose">Chiudi</button>
      </div>`);
    overlay.querySelectorAll("[data-t]").forEach(bn=>bn.addEventListener("click",()=>{
      toggle(bn.dataset.t);save();render();draw();
    }));
    overlay.querySelectorAll("[data-e]").forEach(bn=>bn.addEventListener("click",()=>{
      labelModal(state.etichette.find(x=>x.id===bn.dataset.e),{onSaved:()=>{render();draw();}});
    }));
    $("#mNew").addEventListener("click",()=>labelModal(null,{onSaved:id=>{
      if(id){toggle(id,true);save();}
      render();draw();
    }}));
    $("#mClose").addEventListener("click",()=>{closeModal();render();});
  }
  draw();
}

/* Azioni su un'etichetta assegnata */
function chipActionModal(entry,contesto,onRemove){
  if(!entry)return;
  openModal(`
    <h2><span class="chip" style="background:${entry.colore}">${esc(entry.testo)}</span></h2>
    <div class="mrow col">
      <button class="mbtn sec" id="mEdit">✏️ Modifica ovunque</button>
      <button class="mbtn del" id="mRem">Togli da quest${esc(contesto)}</button>
      <button class="mbtn sec" id="mCancel">Annulla</button>
    </div>`);
  $("#mEdit").addEventListener("click",()=>{closeModal();labelModal(entry);});
  $("#mRem").addEventListener("click",()=>{onRemove();closeModal();save();render();});
  $("#mCancel").addEventListener("click",closeModal);
}

/* ---------- SCHERMO SEMPRE ACCESO ---------- */
let wakeLock=null, wakeVoluto=false;
const btnWake=$("#btnWake");
async function attivaWake(){
  if(!("wakeLock" in navigator)){
    alert("Il tuo telefono/browser non supporta lo schermo sempre acceso da qui. In alternativa puoi disattivare lo spegnimento automatico dello schermo dalle Impostazioni display di Android mentre usi l'app.");
    return;
  }
  try{
    wakeLock=await navigator.wakeLock.request("screen");
    wakeVoluto=true;
    btnWake.classList.add("on");
    wakeLock.addEventListener("release",()=>{
      /* il sistema può rilasciarlo da solo (es. app in background): se l'utente lo voleva ancora attivo,
         lo segnaliamo come spento finché non torna in primo piano, dove lo riattiviamo in automatico */
      btnWake.classList.remove("on");
    });
  }catch(e){
    alert("Non è stato possibile mantenere lo schermo acceso: "+e.message);
  }
}
async function disattivaWake(){
  wakeVoluto=false;
  if(wakeLock){try{await wakeLock.release();}catch(e){}wakeLock=null;}
  btnWake.classList.remove("on");
}
btnWake.addEventListener("click",()=>{
  if(wakeLock)disattivaWake(); else attivaWake();
});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&wakeVoluto&&!wakeLock)attivaWake();
});

/* ---------- BACKUP / RIPRISTINO ---------- */
$("#btnBackup").addEventListener("click",()=>{
  openModal(`
    <h2>Backup dei dati</h2>
    <div class="hint" style="margin-bottom:12px">I dati vivono solo su questo telefono. Esporta un backup di tanto in tanto (foto comprese) e conservalo su Drive, e-mail o PC.</div>
    <div class="mrow col">
      <button class="mbtn pri" id="mExp">⇪ Esporta backup completo</button>
      <button class="mbtn sec" id="mImp">⇩ Ripristina da backup</button>
      <button class="mbtn sec" id="mCancel">Chiudi</button>
    </div>`);
  $("#mCancel").addEventListener("click",closeModal);
  $("#mExp").addEventListener("click",async()=>{closeModal();await esportaBackup();});
  $("#mImp").addEventListener("click",()=>{closeModal();$("#fileImport").click();});
});
function blob2data(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
async function data2blob(d){return (await fetch(d)).blob();}
async function esportaBackup(){
  const copia=JSON.parse(JSON.stringify(state,(k,v)=>v instanceof Blob?undefined:v));
  for(let i=0;i<state.apiari.length;i++)for(let j=0;j<state.apiari[i].arnie.length;j++){
    const f=state.apiari[i].arnie[j].foto;
    copia.apiari[i].arnie[j].foto=f?await blob2data(f):null;
  }
  const blob=new Blob([JSON.stringify(copia)],{type:"application/json"});
  const nome="apidiario_backup_"+new Date().toISOString().slice(0,10)+".json";
  const file=new File([blob],nome,{type:"application/json"});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:nome});return;}catch(e){if(e.name==="AbortError")return;}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$("#fileImport").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  if(!confirm("Il ripristino sostituirà tutti i dati attuali. Continuare?"))return;
  try{
    const nuovo=JSON.parse(await f.text());
    if(!Array.isArray(nuovo.apiari))throw new Error("file non valido");
    for(const ap of nuovo.apiari){
      ap.bacheca=ap.bacheca||{etichette:[],note:[]};
      for(const ar of ap.arnie||[])ar.foto=ar.foto?await data2blob(ar.foto):null;
    }
    state=nuovo;migra();await save();go("home",null,null);
    alert("Backup ripristinato.");
  }catch(err){alert("Impossibile leggere il backup: "+err.message);}
});

/* ---------- MIGRAZIONE E AVVIO ---------- */
function migra(){
  state.etichette=state.etichette||[];
  const addCat=e=>{if(e&&e.id&&!state.etichette.some(x=>x.id===e.id))state.etichette.push({id:e.id,testo:e.testo,colore:e.colore});};
  state.apiari.forEach(a=>{
    a.bacheca=a.bacheca||{etichette:[],note:[]};
    a.bacheca.note.forEach(n=>{if(n.scadenza===undefined)n.scadenza=null;});
    if(a.bacheca.etichette.some(e=>e&&e.testo!==undefined)){
      a.bacheca.etichette=a.bacheca.etichette.map(e=>{addCat(e);return{id:e.id,attiva:e.attiva!==false};});
    }
    a.arnie.forEach(ar=>{
      ar.trattamenti=ar.trattamenti||[];
      ar.trattamenti.forEach(t=>{t.cadute=t.cadute||[];});
      ar.nutrizione=ar.nutrizione||[];
      ar.melari=ar.melari||[];
      ar.produzione=ar.produzione||[];
      ar.sciamature=ar.sciamature||[];
      if(ar.etichette.some(e=>e&&e.testo!==undefined)){
        ar.etichette=ar.etichette.map(e=>{addCat(e);return e.id;});
      }
    });
  });
}
(async()=>{
  try{await openDB();state=await dbGet("state");}catch(e){}
  if(!state)state={apiari:[]};
  migra();
  render();
})();
